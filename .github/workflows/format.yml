name: format

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install Oxfmt
              run: npm install --global oxfmt@0.79.0

            - name: Check formatting
              run: oxfmt --check .
